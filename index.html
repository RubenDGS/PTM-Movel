<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#334b59">
<title>PTM Móvel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#24323a}
header{background:#334b59;color:#fff;padding:16px 14px}
header h1{margin:0;font-size:22px}
header div{margin-top:4px;color:#dbe4e9}
main{max-width:820px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #cbd5da;border-radius:12px;margin:12px 0;overflow:hidden}
.card h2{margin:0;padding:12px;background:#e9eff3;font-size:18px}
.inside{padding:12px}
.drop{display:block;border:2px dashed #9eafb9;border-radius:10px;padding:26px 14px;text-align:center;background:#fafcfd}
.drop input{display:none}
.drop strong{display:block;font-size:19px;margin-bottom:7px}
.hint{font-size:13px;color:#6d7a82;line-height:1.45}
.photo{display:grid;grid-template-columns:70px 1fr 42px;gap:10px;align-items:center;border:1px solid #d8dfe3;border-radius:9px;padding:8px;margin-top:10px}
.photo img{width:70px;height:70px;object-fit:cover;border-radius:6px}
.photo select{width:100%;padding:10px;border:1px solid #adb9c0;border-radius:7px;background:white}
.name{font-size:12px;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font-size:14px;border:1px solid #adb9c0;border-radius:8px;padding:10px;background:white}
.primary{width:100%;margin-top:12px;background:#1976b9;color:#fff;border-color:#1976b9;font-weight:bold;font-size:17px}
.primary:disabled{opacity:.55}
.status{margin-top:10px;font-size:13px;line-height:1.45}
.ok{color:#287347}.err{color:#a43131}
.result{display:none}.result.show{display:block}
.section{border-top:1px solid #e0e5e8}
.section:first-child{border-top:0}
.section-title{padding:10px 12px;background:#f6f8f9;font-weight:bold}
.fields{padding:2px 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,42%) 40px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f3}
.row:last-child{border-bottom:0}
.k{font-size:12px;color:#61717a}
.v{font-size:13px;font-weight:600;word-break:break-word}
.empty{color:#a0aab0;font-weight:400}
.copy{padding:7px 0}
.copied{background:#dff3e6;color:#23683b}
.raw{white-space:pre-wrap;font-family:monospace;font-size:11px;background:#f8fafb;border-radius:8px;padding:10px;max-height:280px;overflow:auto}
.phasebar{display:flex;gap:6px;padding:10px 12px}
.phasebar button{flex:1}
.phasebar .active{background:#334b59;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>⚡ PTM Móvel</h1>
  <div>Auxiliar para preencher o Ativo no PTM original</div>
</header>

<main>
<section class="card">
  <h2>📸 Chapas</h2>
  <div class="inside">
    <label class="drop">
      <strong>Carregar fotografias</strong>
      <span class="hint">Seleciona transformador, regulador e/ou travessias. Nas travessias indica A, B, C ou N.</span>
      <input id="files" type="file" accept="image/*" multiple>
    </label>
    <div id="photos"></div>
    <button id="analyze" class="primary">Ler chapas</button>
    <div id="status" class="status">Ainda não foram carregadas fotografias.</div>
  </div>
</section>

<section id="results" class="card result">
  <h2>📋 Dados para copiar para o PTM</h2>
  <div id="output"></div>
</section>

<section id="rawCard" class="card result">
  <h2>🔎 Resposta da leitura</h2>
  <div id="raw" class="inside"></div>
</section>
</main>

<script>
const WORKER="https://ptm-analise.rdgsantos1987-rs.workers.dev/analisar";

let files=[];
let activePhase="A";

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

const choices=[
 ["AUTO","Automático"],
 ["TRANSFORMADOR","Transformador"],
 ["REGULADOR","Regulador"],
 ["A","Travessia A"],
 ["B","Travessia B"],
 ["C","Travessia C"],
 ["N","Travessia N"]
];

$("#files").onchange=e=>{
  files=[...e.target.files].map(f=>({f,tipo:"AUTO"}));
  drawPhotos();
};

function drawPhotos(){
  $("#photos").innerHTML=files.map((o,i)=>`
  <div class="photo">
    <img id="img${i}">
    <div>
      <div class="name">${esc(o.f.name)}</div>
      <select data-i="${i}">
        ${choices.map(([v,l])=>`<option value="${v}" ${o.tipo===v?"selected":""}>${l}</option>`).join("")}
      </select>
    </div>
    <button data-r="${i}">✕</button>
  </div>`).join("");

  files.forEach((o,i)=>$("#img"+i).src=URL.createObjectURL(o.f));
  document.querySelectorAll("select[data-i]").forEach(s=>s.onchange=()=>files[+s.dataset.i].tipo=s.value);
  document.querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>{files.splice(+b.dataset.r,1);drawPhotos()});
  $("#status").textContent=files.length?`${files.length} fotografia(s) selecionada(s).`:"Ainda não foram carregadas fotografias.";
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function valueRow(label,value){
  const v=value??"";
  return `<div class="row">
    <div class="k">${esc(label)}</div>
    <div class="v ${v?"":"empty"}">${v?esc(v):"Não indicado"}</div>
    <button class="copy" ${v?"":"disabled"} data-copy="${esc(v)}">📋</button>
  </div>`;
}

function section(title,rows){
  return `<div class="section"><div class="section-title">${esc(title)}</div><div class="fields">${rows}</div></div>`;
}

function renderResult(data){
  const resultados=Array.isArray(data.resultados)?data.resultados:[];
  const ok=resultados.filter(x=>x&&x.resultado);

  if(!ok.length){
    $("#output").innerHTML=`<div class="inside err">A leitura terminou, mas não encontrou dados utilizáveis.</div>`;
    $("#results").classList.add("show");
    return;
  }

  const first=ok[0].resultado||{};
  const d=first.dados||{};

  let html="";
  html+=section("Transformador / chapa principal",
    valueRow("Tipo de chapa",first.tipo_chapa)+
    valueRow("Fabricante",first.fabricante)+
    valueRow("Tipo / Modelo",first.modelo_tipo)+
    valueRow("N.º de série",first.numero_serie)+
    valueRow("Ano",first.ano)+
    valueRow("Norma",first.norma)+
    valueRow("Potência nominal",d.potencia_nominal)+
    valueRow("Número de fases",d.numero_fases)+
    valueRow("Frequência",d.frequencia)+
    valueRow("Grupo de ligações",d.grupo_ligacoes)+
    valueRow("Arrefecimento",d.arrefecimento)+
    valueRow("Tensão AT",d.tensao_AT)+
    valueRow("Tensão BT",d.tensao_BT)+
    valueRow("Corrente AT",d.corrente_AT)+
    valueRow("Corrente BT",d.corrente_BT)+
    valueRow("Nível de isolamento AT",d.nivel_isolamento_AT)+
    valueRow("Nível de isolamento BT",d.nivel_isolamento_BT)+
    valueRow("Ucc / tensão de curto-circuito",d.tensao_curto_circuito_Ucc)+
    valueRow("Impedância de curto-circuito",d.impedancia_curto_circuito)+
    valueRow("Massa total",d.massa_total)+
    valueRow("Massa do óleo",d.massa_oleo)+
    valueRow("Massa de transporte",d.massa_transporte)+
    valueRow("Temperatura do óleo",d.temperatura_oleo)+
    valueRow("Temperatura do enrolamento",d.temperatura_enrolamento)
  );

  html+=section("Regulador",
    valueRow("N.º de posições",d.numero_posicoes_regulador)+
    valueRow("Posições / tensões",d.posicoes_regulador)
  );

  html+=`<div class="section"><div class="section-title">Travessias</div>
    <div class="phasebar">${["A","B","C","N"].map(p=>`<button class="${p===activePhase?"active":""}" data-phase="${p}">${p}</button>`).join("")}</div>
    <div id="bushingFields" class="fields"></div>
  </div>`;

  const extras=first.outros_campos_visiveis||{};
  const extraEntries=Object.entries(extras);
  if(extraEntries.length){
    html+=section("Outros campos visíveis",extraEntries.map(([k,v])=>valueRow(k,typeof v==="object"?JSON.stringify(v):v)).join(""));
  }

  $("#output").innerHTML=html;
  $("#results").classList.add("show");

  window.__resultados=resultados;
  renderBushing();

  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.copy)return;
    try{await navigator.clipboard.writeText(b.dataset.copy)}catch{}
    b.textContent="✓";b.classList.add("copied");
  });

  document.querySelectorAll("[data-phase]").forEach(b=>b.onclick=()=>{
    activePhase=b.dataset.phase;
    renderResult(data);
  });
}

function renderBushing(){
  const resultados=window.__resultados||[];
  const item=resultados.find(x=>x&&x.resultado&&String(x.tipo||"").toUpperCase()===activePhase)
    || resultados.find(x=>x&&x.resultado&&x.resultado.tipo_chapa==="travessia");
  const r=item?.resultado||{};
  const d=r.dados||{};
  $("#bushingFields").innerHTML=
    valueRow("Fabricante",r.fabricante)+
    valueRow("Tipo / Modelo",r.modelo_tipo)+
    valueRow("N.º de série",r.numero_serie)+
    valueRow("Tensão nominal",d.tensao_nominal_travessia)+
    valueRow("Tensão máxima",d.tensao_maxima_travessia)+
    valueRow("Corrente nominal",d.corrente_nominal_travessia)+
    valueRow("BIL",d.BIL)+
    valueRow("FD C1",d.FD_C1)+
    valueRow("C1",d.C1_pF)+
    valueRow("FD C2",d.FD_C2)+
    valueRow("C2",d.C2_pF);

  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.copy)return;
    try{await navigator.clipboard.writeText(b.dataset.copy)}catch{}
    b.textContent="✓";b.classList.add("copied");
  });
}

$("#analyze").onclick=async()=>{
  if(!files.length){
    $("#status").innerHTML='<span class="err">Carrega pelo menos uma fotografia.</span>';
    return;
  }

  const btn=$("#analyze");
  btn.disabled=true;
  btn.textContent="A ler…";
  $("#status").textContent="A analisar a(s) chapa(s)…";

  try{
    const images=[];
    for(const o of files){
      images.push({name:o.f.name,tipo:o.tipo,image:await fileToDataURL(o.f)});
    }

    const response=await fetch(WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({images})
    });

    const text=await response.text();
    let data;
    try{data=JSON.parse(text)}catch{throw new Error("Resposta inválida do serviço de leitura.")}

    $("#raw").innerHTML=`<div class="raw">${esc(JSON.stringify(data,null,2))}</div>`;
    $("#rawCard").classList.add("show");

    if(!response.ok||!data.ok)throw new Error(data.erro||"Falha na leitura.");

    renderResult(data);
    $("#status").innerHTML='<span class="ok">✓ Leitura concluída. Confirma os valores antes de os copiar para o PTM.</span>';

  }catch(e){
    $("#status").innerHTML=`<span class="err">Erro: ${esc(e.message)}</span>`;
  }finally{
    btn.disabled=false;
    btn.textContent="Ler chapas";
  }
};
</script>
</body>
</html>
