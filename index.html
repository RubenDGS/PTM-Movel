<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#334b59">
<title>PTM Movimento</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#24323a}
header{background:#334b59;color:#fff;padding:15px 14px}header h1{font-size:20px;margin:0}header small{color:#d9e3e8}
main{max-width:820px;margin:auto;padding:11px 11px 50px}.card{background:#fff;border:1px solid #ccd5da;border-radius:10px;margin:10px 0;overflow:hidden}
.card h2{font-size:15px;margin:0;padding:11px 12px;background:#e9eff3}.inside{padding:12px}
.drop{display:block;border:2px dashed #9eafb9;border-radius:9px;padding:20px 12px;text-align:center;background:#f9fbfc;cursor:pointer}.drop input{display:none}
.drop strong{display:block;font-size:17px;margin-bottom:5px}.hint{font-size:12px;color:#697982;line-height:1.45}
.photos{display:grid;gap:8px;margin-top:10px}.photo{display:grid;grid-template-columns:62px 1fr 36px;gap:8px;align-items:center;border:1px solid #d6dde1;border-radius:8px;padding:7px}
.photo img{width:62px;height:62px;object-fit:cover;border-radius:5px}.photo select{width:100%;padding:8px;border:1px solid #aebbc3;border-radius:6px;background:white}
.name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}
button{font-size:14px;padding:10px 12px;border:1px solid #aebbc3;border-radius:7px;background:#fff}.primary{background:#1976b9;color:#fff;border-color:#1976b9;width:100%;font-weight:bold;margin-top:10px}
.primary:disabled{opacity:.55}.status{font-size:12px;margin-top:9px;color:#667780}.result{display:none}.result.show{display:block}
.block{border-top:1px solid #e2e7ea;padding:10px 12px}.block:first-child{border-top:0}.block h3{font-size:14px;margin:0 0 8px}
.row{display:grid;grid-template-columns:46% 1fr 34px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}
.k{font-size:11px;color:#60717a}.v{font-size:12px;font-weight:600;word-break:break-word}.copy{padding:6px 0}.copied{background:#dff3e6;color:#23683b}
table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #d9e0e4;padding:5px;vertical-align:top}th{background:#f1f5f7}
.badge{display:inline-block;padding:3px 7px;border-radius:12px;background:#e7eef3;font-size:10px;margin-left:5px}
.err{color:#9d2f2f}.ok{color:#287347}
</style>
</head>
<body>
<header><h1>⚡ PTM Movimento <span class="badge">teste IA</span></h1><small>Auxiliar móvel para preenchimento do Ativo no PTM</small></header>
<main>
<section class="card">
<h2>📸 Fotografias das chapas</h2>
<div class="inside">
<label class="drop"><strong>Carregar fotografias</strong><span class="hint">Escolhe as chapas do transformador, regulador e travessias. Nas travessias indica A, B, C ou N.</span><input id="files" type="file" accept="image/*" multiple></label>
<div id="photos" class="photos"></div>
<button id="analyze" class="primary">Analisar e preencher</button>
<div id="status" class="status">Ainda não foram carregadas fotografias.</div>
</div>
</section>
<section id="result" class="card result"><h2>📋 Dados lidos das chapas</h2><div id="out"></div></section>
</main>
<script>
const WORKER="https://ptm-analise.rdgsantos1987-rs.workers.dev/analisar";
let files=[];
const labels=[["AUTO","Automático"],["TRANSFORMADOR","Transformador"],["REGULADOR","Regulador / OLTC"],["A","Travessia A"],["B","Travessia B"],["C","Travessia C"],["N","Travessia N"]];
const $=s=>document.querySelector(s);
$("#files").onchange=e=>{files=[...e.target.files].map(f=>({f,tipo:"AUTO"}));renderPhotos()};
function renderPhotos(){
 $("#photos").innerHTML=files.map((o,i)=>`<div class="photo"><img id="im${i}"><div><div class="name">${esc(o.f.name)}</div><select data-i="${i}">${labels.map(x=>`<option value="${x[0]}" ${o.tipo===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div><button data-r="${i}">✕</button></div>`).join("");
 files.forEach((o,i)=>$("#im"+i).src=URL.createObjectURL(o.f));
 document.querySelectorAll("select[data-i]").forEach(s=>s.onchange=()=>files[+s.dataset.i].tipo=s.value);
 document.querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>{files.splice(+b.dataset.r,1);renderPhotos()});
 $("#status").textContent=files.length?`${files.length} fotografia(s) selecionada(s).`:"Ainda não foram carregadas fotografias.";
}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function dataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function flatten(obj,prefix=""){
 const rows=[];
 if(!obj||typeof obj!=="object") return rows;
 for(const [k,v] of Object.entries(obj)){
   const key=prefix?`${prefix} · ${k}`:k;
   if(v==null||v===""||(Array.isArray(v)&&!v.length)) continue;
   if(Array.isArray(v)){ if(v.length && typeof v[0]==="object") continue; rows.push([key,v.join(", ")]) }
   else if(typeof v==="object") rows.push(...flatten(v,key));
   else rows.push([key,String(v)]);
 }
 return rows;
}
function renderResult(data){
 const root=$("#out"); root.innerHTML="";
 for(const item of data.resultados||[]){
   const d=item.resultado||{};
   let html=`<div class="block"><h3>${esc(item.nome||"Fotografia")} <span class="badge">${esc(item.tipo_indicado||"")}</span></h3>`;
   if(item.erro){html+=`<div class="err">${esc(item.erro)}</div></div>`;root.insertAdjacentHTML("beforeend",html);continue}
   const rows=flatten(d);
   html+=rows.map(([k,v])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><button class="copy" data-v="${esc(v)}">📋</button></div>`).join("");
   const pos=d?.regulador?.posicoes;
   if(Array.isArray(pos)&&pos.length){
     html+=`<h3 style="margin-top:12px">Posições do regulador</h3><div style="overflow:auto"><table><tr><th>Pos.</th><th>Tensão</th><th>Corrente</th><th>Seletor</th><th>Pré-seletor</th></tr>${pos.map(p=>`<tr><td>${esc(p.posicao)}</td><td>${esc(p.tensao)}</td><td>${esc(p.corrente)}</td><td>${esc(p.seletor)}</td><td>${esc(p.pre_seletor)}</td></tr>`).join("")}</table></div>`;
   }
   html+="</div>"; root.insertAdjacentHTML("beforeend",html);
 }
 document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.v);b.textContent="✓";b.classList.add("copied")}catch{}});
 $("#result").classList.add("show");
}
$("#analyze").onclick=async()=>{
 if(!files.length){$("#status").textContent="Carrega pelo menos uma fotografia.";return}
 const btn=$("#analyze");btn.disabled=true;btn.textContent="A analisar…";$("#status").textContent="A enviar as fotografias para análise.";
 try{
   const images=[];
   for(const o of files) images.push({name:o.f.name,tipo:o.tipo,image:await dataUrl(o.f)});
   const r=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images})});
   const data=await r.json();
   if(!r.ok||!data.ok) throw new Error(data.error||"Falha na análise");
   renderResult(data);$("#status").innerHTML='<span class="ok">✓ Análise concluída.</span>';
 }catch(e){$("#status").innerHTML=`<span class="err">Erro: ${esc(e.message)}</span>`}
 finally{btn.disabled=false;btn.textContent="Analisar e preencher"}
};
</script>
</body></html>
